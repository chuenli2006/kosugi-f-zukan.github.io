<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">風俗履歴図鑑 (Sandbox)</title>
  
  <style>
    :root {
      --bg-color: #fdfbfb;
      --card-bg: #ffffff;
      --primary-pink: #ff85a2;
      --soft-pink: #ffe6ea;
      --accent-pink: #f72585;
      --text-color: #4a4a4a;
      --light-text: #8d8d8d;
      --border-color: #f0e6e8;
      --shadow: 0 4px 15px rgba(255, 133, 162, 0.1);
      --radius: 12px;

      --gold-bg-start: #fff9e6;
      --gold-bg-end: #fff0c2;
      --gold-border: #f3c642;
      --gold-text: #8a6200;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 16px 12px 80px;
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--soft-pink);
      position: relative;
    }

    header h1 {
      font-size: 1.4rem;
      color: var(--accent-pink);
    }

    header p {
      font-size: 0.8rem;
      color: var(--light-text);
    }

    .header-btns {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }

    .user-tag-btn, .help-btn {
      background: var(--soft-pink);
      color: var(--accent-pink);
      border: 1px solid var(--primary-pink);
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .help-btn { background: #fff; }

    .tab-nav {
      display: flex;
      margin-bottom: 12px;
      border-bottom: 2px solid var(--soft-pink);
    }

    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      background: none;
      border: none;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--light-text);
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      color: var(--accent-pink);
      border-bottom: 3px solid var(--accent-pink);
    }

    .dashboard {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .dash-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
    }

    .dash-item {
      background: var(--bg-color);
      padding: 6px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .dash-val { font-size: 1.1rem; font-weight: bold; color: var(--accent-pink); }
    .dash-lbl { font-size: 0.65rem; color: var(--light-text); }

    .controls {
      background: var(--card-bg);
      padding: 12px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-row { display: flex; gap: 6px; }
    .search-box { flex: 1; }
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      font-size: 0.85rem;
      outline: none;
      background: var(--bg-color);
    }

    .btn-gacha {
      background: linear-gradient(135deg, #ff85a2, #f72585);
      color: #fff;
      border: none;
      padding: 0 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-tags { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
    .ftag {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      cursor: pointer;
      white-space: nowrap;
    }
    .ftag.active { background: var(--accent-pink); color: #fff; border-color: var(--accent-pink); }

    .btn-group { display: flex; gap: 6px; }
    .btn-toggle {
      flex: 1;
      padding: 5px 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      border-radius: 16px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .btn-toggle.active { background: var(--primary-pink); color: white; border-color: var(--primary-pink); }

    .grid { display: flex; flex-direction: column; gap: 8px; }
    details.cast-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    details.cast-card.favorite { border-left: 5px solid var(--accent-pink); }
    details.cast-card.super-favorite {
      background: linear-gradient(135deg, var(--gold-bg-start), var(--gold-bg-end));
      border: 1px solid var(--gold-border);
      border-left: 6px solid var(--gold-border);
    }

    details.cast-card .anim-wrapper {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    details.cast-card[open] .anim-wrapper {
      grid-template-rows: 1fr;
    }

    .anim-inner { overflow: hidden; }

    summary.card-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      cursor: pointer;
      list-style: none;
      font-weight: bold;
    }
    summary.card-btn::-webkit-details-marker { display: none; }

    .arrow-icon {
      font-size: 0.75rem; color: #8d8d8d; display: inline-block; transition: transform 0.3s ease;
    }
    details[open] summary .arrow-icon { transform: rotate(180deg); color: var(--accent-pink); }

    .cast-info { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .status-badge { font-size: 0.65rem; padding: 1px 5px; border-radius: 8px; font-weight: bold; }
    .status-active { background: #e6fcf5; color: #0ca678; border: 1px solid #20c997; }
    .status-retired { background: #f1f3f5; color: #868e96; border: 1px solid #ced4da; }
    .old-name-badge { font-size: 0.65rem; background: #f1f3f5; color: #6c757d; padding: 1px 6px; border-radius: 6px; }
    .super-tag { font-size: 0.65rem; background: var(--gold-border); color: #fff; padding: 1px 5px; border-radius: 8px; font-weight: bold; }
    .badge-count { background: var(--soft-pink); color: var(--accent-pink); font-weight: bold; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; }

    .card-body {
      padding: 10px 14px 12px;
      border-top: 1px dashed var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .style-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 2px; }
    .style-pill {
      display: inline-flex; align-items: center; border-radius: 8px; overflow: hidden; font-size: 0.7rem; font-weight: bold; border: 1px solid rgba(0,0,0,0.08);
    }
    .style-pill-label { padding: 2px 7px; color: #ffffff; }
    .style-pill-val { padding: 2px 8px; }
    .style-none { font-size: 0.68rem; color: #a0a0a0; background: #f1f3f5; padding: 2px 8px; border-radius: 6px; }

    .p-blue .style-pill-label { background-color: #339af0; }
    .p-blue .style-pill-val   { background-color: #e7f5ff; color: #1c7ed6; }
    .p-green .style-pill-label { background-color: #51cf66; }
    .p-green .style-pill-val   { background-color: #ebfbee; color: #2b8a3e; }
    .p-yellow .style-pill-label { background-color: #fcc419; }
    .p-yellow .style-pill-val   { background-color: #fff9db; color: #d9480f; }
    .p-purple .style-pill-label { background-color: #cc5de8; }
    .p-purple .style-pill-val   { background-color: #f3d9fa; color: #9c36b5; }
    .p-pink1 .style-pill-label { background-color: #ff85a2; }
    .p-pink1 .style-pill-val   { background-color: #fff0f6; color: #d6336c; }

    .card-middle-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .notes-box { font-size: 0.75rem; color: #666; background: #fdf8f9; padding: 4px 8px; border-radius: 6px; border: 1px solid #f2e3e6; flex: 1; }
    .btn-action-group { display: flex; gap: 4px; }
    .link-btn, .copy-btn, .letter-btn {
      font-size: 0.7rem; padding: 3px 8px; border-radius: 10px; cursor: pointer; border: 1px solid var(--primary-pink); background: #fff; color: var(--accent-pink); white-space: nowrap;
    }
    .letter-btn { background: var(--soft-pink); font-weight: bold; }
    .days-ago-tag { font-size: 0.7rem; color: var(--light-text); text-align: right; }
    .history-row { display: flex; justify-content: space-between; background: #fff; border: 1px solid var(--border-color); padding: 5px 8px; border-radius: 6px; font-size: 0.8rem; }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
      background: #fff; padding: 20px 16px; border-radius: 20px; text-align: center; max-width: 380px; width: 92%; box-shadow: 0 10px 30px rgba(247, 37, 133, 0.3); border: 2px solid var(--soft-pink); max-height: 85vh; overflow-y: auto;
    }
    .modal-content h3 { color: var(--accent-pink); margin-bottom: 8px; font-size: 1.1rem; }

    .close-btn {
      background: linear-gradient(135deg, #ff85a2, #f72585); color: white; border: none; padding: 8px 22px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; cursor: pointer; margin-top: 10px;
    }

    .fab-add {
      position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; border-radius: 28px; background: linear-gradient(135deg, #ff85a2, #f72585); color: white; border: none; font-size: 1.6rem; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(247, 37, 133, 0.4); cursor: pointer; z-index: 900;
    }

    .add-form { display: flex; flex-direction: column; gap: 10px; text-align: left; margin-top: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 0.75rem; font-weight: bold; color: var(--accent-pink); }
    .form-group input, .form-group select, .form-group textarea {
      padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.85rem; outline: none; background: var(--bg-color); width: 100%;
    }

    .style-grid-compact { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 100%; }
    .style-grid-compact input { padding: 6px 2px; text-align: center; font-size: 0.78rem; font-weight: bold; min-width: 0; }

    .flag-picker { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
    .flag-btn { font-size: 0.72rem; padding: 4px 8px; border-radius: 12px; border: 1px solid var(--border-color); background: #fff; cursor: pointer; }

    .backup-section { margin-top: 15px; padding-top: 12px; border-top: 1px dashed var(--border-color); text-align: left; }
    .backup-section h4 { font-size: 0.8rem; color: var(--accent-pink); margin-bottom: 6px; }

    .storage-selector-box {
      background: var(--soft-pink);
      border: 1px solid var(--primary-pink);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .radio-group { display: flex; gap: 12px; font-size: 0.8rem; font-weight: bold; margin-top: 4px; }
    .github-inputs {
      margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--primary-pink); display: flex; flex-direction: column; gap: 6px;
    }
    .sync-status { font-size: 0.7rem; color: #0ca678; font-weight: bold; text-align: right; }

    .shared-card {
      background: #ffffff; border: 1px solid var(--soft-pink); border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: var(--shadow);
    }
    .shared-header {
      font-size: 0.85rem; font-weight: bold; color: var(--accent-pink); margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px dashed var(--border-color); display: flex; justify-content: space-between; align-items: center;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle">風俗履歴図鑑</h1>
    <p>マイ キャスト＆プレイレコード (Sandbox)</p>
    <div class="header-btns">
      <button class="user-tag-btn" onclick="openUserModal()">👤 ユーザー: <span id="currentUserNameDisplay">童貞</span></button>
      <button class="help-btn" onclick="openHelpModal()">❓ 使い方</button>
    </div>
  </header>

  <div class="tab-nav">
    <button class="tab-btn active" id="tabMyRecords" onclick="switchMainTab('my')">👤 マイ図鑑</button>
    <button class="tab-btn" id="tabSharedRecords" onclick="switchMainTab('shared')">👥 共有された履歴 (<span id="sharedCount">0</span>)</button>
  </div>

  <div id="myTabArea">
    <details class="dashboard">
      <summary style="font-size:0.8rem; font-weight:bold; color:var(--accent-pink); cursor:pointer;">📊 利用統計ダッシュボードを表示／非表示</summary>
      <div class="dash-grid" style="margin-top:10px;">
        <div class="dash-item"><div class="dash-val" id="stTotalVisits">0</div><div class="dash-lbl">総利用回数</div></div>
        <div class="dash-item"><div class="dash-val" id="stTotalCasts">0</div><div class="dash-lbl">経験人数</div></div>
        <div class="dash-item"><div class="dash-val" id="stActiveCasts">0</div><div class="dash-lbl">現在在籍</div></div>
        <div class="dash-item"><div class="dash-val" id="stFavRate">0%</div><div class="dash-lbl">オキニ率</div></div>
      </div>
      <div style="text-align:right; margin-top:8px;">
        <button onclick="resetData()" style="font-size:0.65rem; color:#aaa; background:none; border:none; text-decoration:underline; cursor:pointer;">⚠️ 記録を初期化して「童貞」に戻す</button>
      </div>
    </details>

    <div class="controls">
      <div class="search-row">
        <div class="search-box">
          <input type="text" id="searchKeyword" placeholder="キャスト名やマークで検索..." oninput="render()">
        </div>
        <button class="btn-gacha" onclick="runGacha()">🎰 ガチャ</button>
      </div>

      <div class="filter-tags">
        <div class="ftag active" id="ftAll" onclick="setFilter('all')">すべて</div>
        <div class="ftag" id="ftActive" onclick="setFilter('active')">🟢 在籍のみ</div>
        <div class="ftag" id="ftFav" onclick="setFilter('fav')">🆂 当たり</div>
        <div class="ftag" id="ftSuper" onclick="setFilter('super')">⭐️ オキニ</div>
        <div class="ftag" id="ftBad" onclick="setFilter('bad')">🚨 ハズレ</div>
      </div>

      <div class="btn-group">
        <button class="btn-toggle active" id="viewCast" onclick="changeView('cast')">キャスト別図鑑</button>
        <button class="btn-toggle" id="viewTimeline" onclick="changeView('timeline')">月別時系列</button>
      </div>

      <div class="btn-group" id="sortGroup">
        <button class="btn-toggle active" id="sortCount" onclick="changeSort('count')">回数順</button>
        <button class="btn-toggle" id="sortRecent" onclick="changeSort('recent')">最近順</button>
        <button class="btn-toggle" id="sortName" onclick="changeSort('name')">五十音順</button>
      </div>
    </div>

    <div id="mainContent"></div>
  </div>

  <div id="sharedTabArea" style="display:none;">
    <div id="sharedContent"></div>
  </div>

  <button class="fab-add" onclick="openAddModal()" title="新しい利用記録を追加">＋</button>

  <div class="modal-overlay" id="helpModal">
    <div class="modal-content">
      <h3>📖 ご利用ガイド</h3>
      <div class="help-section" style="text-align:left; font-size:0.8rem;">
        <p><strong>🛡️ 上書き防止機能 (案A):</strong> データは自動的に <code>data_ユーザー名.json</code> として保存されるため、他人のデータと混ざったり上書きされる心配がありません！</p>
      </div>
      <button class="close-btn" onclick="closeModal('helpModal')">はい</button>
    </div>
  </div>

  <!-- 👤 ユーザー設定＆ストレージ設定モーダル -->
  <div class="modal-overlay" id="userModal">
    <div class="modal-content">
      <h3>👤 ユーザー設定＆保存先</h3>
      
      <div class="storage-selector-box">
        <label style="font-size:0.75rem; font-weight:bold; color:var(--accent-pink);">💾 保存先モード選択</label>
        <div class="radio-group">
          <label><input type="radio" name="storageMode" value="local" id="modeLocal" onchange="toggleStorageModeUI()"> 🏠 ローカル保存</label>
          <label><input type="radio" name="storageMode" value="github" id="modeGithub" onchange="toggleStorageModeUI()"> ☁️ GitHub連携</label>
        </div>

        <div class="github-inputs" id="githubConfigBox" style="display:none;">
          <input type="password" id="ghToken" placeholder="GitHub Token (ghp_...)">
          <input type="text" id="ghRepo" placeholder="ユーザー名/リポジトリ名">
          <div style="font-size:0.7rem; color:#666; margin-top:2px;">
            保存ファイル名: <strong id="ghFileNamePreview">data_童貞.json</strong>
          </div>
          <div class="sync-status" id="ghStatusText"></div>
        </div>
      </div>

      <form class="add-form" onsubmit="saveUserSettings(event)">
        <div class="form-group">
          <label>お名前（変更するとファイル名も自動更新されます）</label>
          <input type="text" id="inputUserName" oninput="updateFileNamePreview()" required>
        </div>
        <button type="submit" class="close-btn" style="width:100%;">設定を保存＆同期</button>
      </form>

      <div class="backup-section">
        <h4>📁 JSONファイルのダウンロード / 読み込み</h4>
        <div style="display:flex; gap:6px;">
          <button class="close-btn" style="flex:1; margin-top:0; background:#339af0; font-size:0.75rem;" onclick="exportJSONFile()">💾 ダウンロード</button>
          <button class="close-btn" style="flex:1; margin-top:0; background:#20c997; font-size:0.75rem;" onclick="triggerJSONFileInput()">📂 JSONを選択</button>
        </div>
        <input type="file" id="jsonFileInput" accept=".json,application/json,text/plain" style="display:none;" onchange="importJSONFile(event)">
      </div>

      <button class="close-btn" style="background:#ccc; width:100%; margin-top:12px;" onclick="closeModal('userModal')">閉じる</button>
    </div>
  </div>

  <div class="modal-overlay" id="addModal">
    <div class="modal-content">
      <h3>✨ 利用記録を追加</h3>
      <form class="add-form" onsubmit="saveNewRecord(event)">
        <div class="form-row">
          <div class="form-group">
            <label>年</label>
            <input type="text" id="addYear" placeholder="2026" required>
          </div>
          <div class="form-group">
            <label>月</label>
            <input type="text" id="addMonth" placeholder="8月" required>
          </div>
        </div>

        <div class="form-group">
          <label>キャスト名</label>
          <input type="text" id="addName" placeholder="例: ゆあ" required>
        </div>

        <div class="form-group">
          <label>スリーサイズ</label>
          <div class="style-grid-compact">
            <input type="text" id="addStyleT" placeholder="T">
            <input type="text" id="addStyleB" placeholder="B">
            <input type="text" id="addStyleW" placeholder="W">
            <input type="text" id="addStyleH" placeholder="H">
          </div>
        </div>

        <div class="form-group">
          <label>マーク・フラグ</label>
          <div class="flag-picker">
            <button type="button" class="flag-btn" onclick="addFlagChar('🆂')">🆂 当たり</button>
            <button type="button" class="flag-btn" onclick="addFlagChar('⚔')">⚔ 次ナシ</button>
            <button type="button" class="flag-btn" onclick="addFlagChar('✈')">✈ 県外</button>
            <button type="button" class="flag-btn" onclick="addFlagChar('⑱')">⑱ 18歳</button>
            <button type="button" class="flag-btn" onclick="addFlagChar('❖')">❖ 2万超</button>
            <button type="button" class="flag-btn" onclick="addFlagChar('❀')">❀ 卒業</button>
            <button type="button" class="flag-btn" onclick="addFlagChar('🈠')">🈠 初出勤</button>
            <button type="button" class="flag-btn" onclick="clearFlagsInput()">クリア</button>
          </div>
          <input type="text" id="addFlags" placeholder="マークが入ります">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>旧・源氏名</label>
            <input type="text" id="addOldName" placeholder="例: ここみ">
          </div>
          <div class="form-group">
            <label>プロフURL</label>
            <input type="url" id="addLink" placeholder="https://...">
          </div>
        </div>

        <div class="form-group">
          <label>メモ・備考</label>
          <input type="text" id="addNotes" placeholder="接客メモなど">
        </div>

        <div style="display:flex; gap:8px; margin-top:10px;">
          <button type="submit" class="close-btn" style="flex:1;">保存する</button>
          <button type="button" class="close-btn" onclick="closeModal('addModal')" style="background:#ccc; flex:1;">キャンセル</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // こすぎ専用 Masterデータ
    const kosugiHistoryList = [
      { year: "2025", month: "8月", name: "ゆあ", flags: "🆂" },
      { year: "2025", month: "8月", name: "じゅり", flags: "⚔⚔" },
      { year: "2025", month: "8月", name: "まりあ", flags: "" },
      { year: "2025", month: "8月", name: "ゆあ", flags: "🆂" },
      { year: "2025", month: "9月", name: "ことり", flags: "✈🆂" },
      { year: "2025", month: "9月", name: "さきな", flags: "🈠⑱🆂" },
      { year: "2025", month: "10月", name: "ゆあ", flags: "🆂" },
      { year: "2025", month: "11月", name: "モカ", flags: "🆂" },
      { year: "2025", month: "12月", name: "カルア", flags: "🆂" },
      { year: "2026", month: "2月", name: "るか", flags: "✈🆂" },
      { year: "2026", month: "4月", name: "なるみ", flags: "🆂❀" },
      { year: "2026", month: "6月", name: "さきな", flags: "🆂❖" },
      { year: "2026", month: "7月", name: "ゆあ", flags: "🆂㋑" }
    ];

    const kosugiCastData = {
      "ゆあ": { link: "https://www.cityheaven.net/okinawa/A4701/A470101/lipsokinawa/girlid-60270238/", notes: "", oldName: "", style: "T:154cm B:80(A) W:53 H:84" },
      "さきな": { link: "https://www.yesgrp.com/naha/lesson1/model/model.html?girl_id=3335", notes: "", oldName: "", style: "" },
      "モカ": { link: "https://www.yesgrp.com/naha/sele/model/model.html?girl_id=3367", notes: "", oldName: "", style: "" },
      "カルア": { link: "https://www.yesgrp.com/naha/sele/model/model.html?girl_id=3451", notes: "", oldName: "菜乃花", style: "" }
    };

    let currentUserName = localStorage.getItem('app_user_name') || '童貞';
    let storageMode = localStorage.getItem('app_storage_mode') || 'local';
    let historyList = [];
    let castData = {};
    let sharedRecords = [];
    let currentSha = null;

    /* 💡 案A: ユーザー名から一意なファイル名を決定するヘルパー関数 */
    function getUserFileName(name) {
      const safeName = (name || currentUserName || 'user').trim().replace(/[\/\\?%*:|"<>]/g, '_');
      return `data_${safeName}.json`;
    }

    function isKosugi(name) {
      if (!name) return false;
      const lower = name.trim().toLowerCase();
      return lower === 'こすぎ' || lower === 'ジュン' || lower === 'じゅん' || lower === 'kosugi';
    }

    async function initUserData() {
      if (storageMode === 'github') {
        const success = await loadFromGitHub();
        if (!success) loadLocalData();
      } else {
        loadLocalData();
      }
      updateUIHeader();
      updateSharedCount();
      render();
    }

    function loadLocalData() {
      if (isKosugi(currentUserName)) {
        historyList = JSON.parse(JSON.stringify(kosugiHistoryList));
        castData = JSON.parse(JSON.stringify(kosugiCastData));
      } else {
        const savedHist = localStorage.getItem('user_hist_' + currentUserName);
        const savedCast = localStorage.getItem('user_cast_' + currentUserName);
        historyList = savedHist ? JSON.parse(savedHist) : [];
        castData = savedCast ? JSON.parse(savedCast) : {};
      }
      const savedShared = localStorage.getItem('user_shared_list_' + currentUserName);
      sharedRecords = savedShared ? JSON.parse(savedShared) : [];
    }

    async function loadFromGitHub() {
      const token = localStorage.getItem('gh_token');
      const repo = localStorage.getItem('gh_repo');
      const fileName = getUserFileName(currentUserName);

      if (!token || !repo) return false;

      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/contents/${fileName}`, {
          headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (res.status === 200) {
          const json = await res.json();
          currentSha = json.sha;
          const decodedContent = decodeURIComponent(escape(atob(json.content.replace(/\n/g, ''))));
          const data = JSON.parse(decodedContent);
          historyList = data.historyList || [];
          castData = data.castData || {};
          currentUserName = data.userName || currentUserName;
          const el = document.getElementById('ghStatusText');
          if (el) el.innerText = `🟢 ${fileName} と完全同期中`;
          return true;
        }
      } catch (err) { console.error(err); }
      const el = document.getElementById('ghStatusText');
      if (el) el.innerText = "🔴 GitHub同期エラー";
      return false;
    }

    async function saveToGitHub() {
      const token = localStorage.getItem('gh_token');
      const repo = localStorage.getItem('gh_repo');
      const fileName = getUserFileName(currentUserName);

      if (!token || !repo) return;

      const exportObject = {
        app: "風俗履歴図鑑",
        version: "2.0",
        exportDate: new Date().toISOString(),
        userName: currentUserName,
        historyList: historyList,
        castData: castData
      };

      const contentStr = JSON.stringify(exportObject, null, 2);
      const base64Content = btoa(unescape(encodeURIComponent(contentStr)));

      try {
        const bodyData = { message: `Update ${fileName} by ${currentUserName}`, content: base64Content };
        if (currentSha) bodyData.sha = currentSha;

        const res = await fetch(`https://api.github.com/repos/${repo}/contents/${fileName}`, {
          method: 'PUT',
          headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData)
        });
        if (res.ok) {
          const resJson = await res.json();
          currentSha = resJson.content.sha;
          const el = document.getElementById('ghStatusText');
          if (el) el.innerText = `🟢 ${fileName} コミット完了`;
        }
      } catch (err) { console.error(err); }
    }

    function saveData() {
      localStorage.setItem('app_user_name', currentUserName);
      localStorage.setItem('app_storage_mode', storageMode);

      if (storageMode === 'local') {
        if (!isKosugi(currentUserName)) {
          localStorage.setItem('user_hist_' + currentUserName, JSON.stringify(historyList));
          localStorage.setItem('user_cast_' + currentUserName, JSON.stringify(castData));
        }
      } else if (storageMode === 'github') {
        saveToGitHub();
      }

      localStorage.setItem('user_shared_list_' + currentUserName, JSON.stringify(sharedRecords));
      updateSharedCount();
    }

    function toggleStorageModeUI() {
      const isGithub = document.getElementById('modeGithub').checked;
      document.getElementById('githubConfigBox').style.display = isGithub ? 'flex' : 'none';
      updateFileNamePreview();
    }

    function updateFileNamePreview() {
      const inputName = document.getElementById('inputUserName').value.trim() || currentUserName;
      const previewElem = document.getElementById('ghFileNamePreview');
      if (previewElem) previewElem.innerText = getUserFileName(inputName);
    }

    function saveUserSettings(e) {
      e.preventDefault();
      currentUserName = document.getElementById('inputUserName').value.trim() || '童貞';
      storageMode = document.getElementById('modeGithub').checked ? 'github' : 'local';

      if (storageMode === 'github') {
        localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
        localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
      }

      saveData();
      initUserData();
      closeModal('userModal');
      alert(`設定を保存しました。（保存ファイル名: ${getUserFileName(currentUserName)}）`);
    }

    function updateUIHeader() {
      const titleText = currentUserName + "の風俗履歴図鑑";
      document.getElementById('headerTitle').innerText = titleText;
      document.getElementById('pageTitle').innerText = titleText;
      document.getElementById('currentUserNameDisplay').innerText = currentUserName;
    }

    function updateSharedCount() {
      document.getElementById('sharedCount').innerText = sharedRecords.length;
    }

    function resetData() {
      if (confirm("現在の記録をクリアして「童貞」に戻しますか？")) {
        localStorage.removeItem('user_hist_' + currentUserName);
        localStorage.removeItem('user_cast_' + currentUserName);
        currentUserName = '童貞';
        localStorage.setItem('app_user_name', currentUserName);
        initUserData();
        alert("初期化しました。");
      }
    }

    function exportJSONFile() {
      const fileName = getUserFileName(currentUserName);
      const exportObject = {
        app: "風俗履歴図鑑",
        userName: currentUserName,
        historyList: historyList,
        castData: castData
      };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObject, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", fileName);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerJSONFileInput() { document.getElementById('jsonFileInput').click(); }

    function importJSONFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.historyList && imported.castData) {
            if (confirm("選択したJSONファイルでデータを上書きロードしますか？")) {
              historyList = imported.historyList;
              castData = imported.castData;
              if (imported.userName) currentUserName = imported.userName;
              saveData();
              render();
              closeModal('userModal');
              alert("✨ データを読み込みました！");
            }
          }
        } catch (err) { alert("⚠️ JSONファイルの解析に失敗しました。"); }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function openUserModal() {
      document.getElementById('inputUserName').value = currentUserName === '童貞' ? '' : currentUserName;
      document.getElementById('modeGithub').checked = storageMode === 'github';
      document.getElementById('modeLocal').checked = storageMode !== 'github';

      document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
      document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || '';

      toggleStorageModeUI();
      document.getElementById('userModal').style.display = 'flex';
    }

    function openHelpModal() { document.getElementById('helpModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    let currentView = 'cast', currentSort = 'count', currentFilter = 'all';

    function changeView(m) { currentView = m; render(); }
    function changeSort(s) { currentSort = s; render(); }
    function setFilter(f) { currentFilter = f; render(); }

    function switchMainTab(type) {
      document.getElementById('myTabArea').style.display = type === 'my' ? 'block' : 'none';
      document.getElementById('sharedTabArea').style.display = type === 'shared' ? 'block' : 'none';
      document.getElementById('tabMyRecords').className = 'tab-btn' + (type === 'my' ? ' active' : '');
      document.getElementById('tabSharedRecords').className = 'tab-btn' + (type === 'shared' ? ' active' : '');
    }

    function openAddModal() {
      const now = new Date();
      document.getElementById('addYear').value = now.getFullYear();
      document.getElementById('addMonth').value = (now.getMonth() + 1) + '月';
      document.getElementById('addModal').style.display = 'flex';
    }

    function saveNewRecord(e) {
      e.preventDefault();
      const year = document.getElementById('addYear').value.trim();
      const month = document.getElementById('addMonth').value.trim();
      const name = document.getElementById('addName').value.trim();
      if (!year || !month || !name) return alert("必須項目を入力してください");

      historyList.push({ year, month, name, flags: document.getElementById('addFlags').value.trim() });
      if (!castData[name]) {
        castData[name] = {
          link: document.getElementById('addLink').value.trim(),
          notes: document.getElementById('addNotes').value.trim(),
          oldName: document.getElementById('addOldName').value.trim(),
          style: document.getElementById('addStyleT').value ? `T:${document.getElementById('addStyleT').value}` : ""
        };
      }
      saveData();
      closeModal('addModal');
      render();
    }

    function renderStyleTags(styleStr) {
      if (!styleStr || !styleStr.trim()) return '<div class="style-row"><span class="style-none">スタイルデータなし</span></div>';
      return `<div class="style-row"><span class="style-pill p-blue"><span class="style-pill-label">DATA</span><span class="style-pill-val">${styleStr}</span></span></div>`;
    }

    function updateStats(map) {
      const list = Object.values(map);
      document.getElementById('stTotalVisits').innerText = historyList.length;
      document.getElementById('stTotalCasts').innerText = list.length;
      const activeCount = list.filter(c => castData[c.name] && castData[c.name].link && castData[c.name].link.trim() !== "").length;
      document.getElementById('stActiveCasts').innerText = activeCount;
      const favCount = list.filter(c => c.favCount >= 1).length;
      document.getElementById('stFavRate').innerText = (list.length > 0 ? Math.round((favCount / list.length) * 100) : 0) + "%";
    }

    function render() {
      const target = document.getElementById('mainContent');
      target.innerHTML = '';

      if (historyList.length === 0) {
        target.innerHTML = '<div style="text-align:center; color:#aaa; padding:40px;">記録がありません。「＋」から追加してください。</div>';
        updateStats({});
        return;
      }

      const map = {};
      historyList.forEach((item, idx) => {
        if (!map[item.name]) map[item.name] = { name: item.name, visits: [], lastVisit: item };
        map[item.name].visits.push(item);
      });

      updateStats(map);

      const grid = document.createElement('div');
      grid.className = 'grid';

      Object.values(map).forEach(c => {
        const details = document.createElement('details');
        details.className = 'cast-card';
        const info = castData[c.name] || {};

        let rowsHtml = '';
        c.visits.forEach(v => {
          rowsHtml += `<div class="history-row"><span>${v.year}年 ${v.month}</span><span>${v.flags||'通常'}</span></div>`;
        });

        details.innerHTML = `
          <summary class="card-btn">
            <div class="cast-info"><span>▼</span><span>${c.name}</span></div>
            <span class="badge-count">${c.visits.length}回</span>
          </summary>
          <div class="card-body">
            ${renderStyleTags(info.style || '')}
            <div class="card-middle-row">
              <div class="notes-box">${info.notes || 'メモなし'}</div>
            </div>
            ${rowsHtml}
          </div>
        `;
        grid.appendChild(details);
      });

      target.appendChild(grid);
    }

    initUserData();
  </script>
</body>
</html>
