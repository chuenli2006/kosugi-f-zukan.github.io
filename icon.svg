<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景のグラデーション（アプリのテーマカラーをイメージ） -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff85a2" />
      <stop offset="100%" stop-color="#f72585" />
    </linearGradient>
    
    <!-- 封筒のグラデーション -->
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffe6ea" />
    </linearGradient>

    <!-- ドロップシャドウ -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- iOS風 角丸アプリ背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- メインモチーフ：封筒（レター） -->
  <g filter="url(#shadow)">
    <!-- 封筒のベースボディ -->
    <rect x="116" y="170" width="280" height="200" rx="24" fill="url(#envGrad)" />
    
    <!-- 封筒のフラップ（上部の三角蓋） -->
    <path d="M 116 194 L 256 290 L 396 194" fill="none" stroke="#f0e6e8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- アクセント：浮き上がる立体的なハート -->
  <g filter="url(#shadow)" transform="translate(256, 215) scale(1.3)">
    <path d="M0 -25 C-25 -55 -70 -15 -35 20 L0 55 L35 20 C70 -15 25 -55 0 -25 Z" fill="#ffffff" />
  </g>
</svg>
