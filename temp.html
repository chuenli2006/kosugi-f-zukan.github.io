<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゆうだい観察BOT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #7494c0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-container {
      width: 100%;
      max-width: 450px;
      height: 90vh;
      background-color: #7494c0;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .chat-header {
      background-color: #2c3e50;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
    }
    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .user-message {
      align-self: flex-end;
      background-color: #85e249;
      color: #000;
      border-bottom-right-radius: 2px;
    }
    .bot-message {
      align-self: flex-start;
      background-color: #ffffff;
      color: #000;
      border-bottom-left-radius: 2px;
    }
    .chat-input-area {
      display: flex;
      padding: 10px;
      background-color: #ffffff;
      border-top: 1px solid #ddd;
    }
    .chat-input-area input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
      font-size: 0.95rem;
    }
    .chat-input-area button {
      margin-left: 8px;
      padding: 10px 16px;
      background-color: #3b5998;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }
    .chat-input-area button:hover {
      background-color: #2d4373;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">ゆうだい情報BOT</div>
  <div class="chat-messages" id="chatMessages">
    <div class="message bot-message">ゆうだいの最新情報をお伝えします！</div>
  </div>
  <div class="chat-input-area">
    <input type="text" id="userInput" placeholder="メッセージを入力..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">送信</button>
  </div>
</div>

<script>
  // 第三者目線のメッセージリスト
  const yudaiMessages = [
    "ゆうだいが今、めちゃくちゃお腹を鳴らしています。",
    "ゆうだいさ、さっきからずっとスマホ見て笑ってるよ。",
    "ゆうだいが『俺に任せろ』ってドヤ顔で言ってました。",
    "ゆうだいさ、実は昨日から全然寝てないらしいよ。",
    "ゆうだいが何か言いたそうにこちらを見ています。",
    "ゆうだいさっき、自分の名前で呼ばれてドヤ顔してました。",
    "ゆうだいが『それめっちゃ良いじゃん！』って絶賛してるよ。",
    "ゆうだいさ、ゲームのプレイ動画見ながらイメトレしてるみたい。",
    "ゆうだいが今、ダッシュでそっちに向かってるらしい！",
    "ゆうだいさ、内心めちゃくちゃ喜んでると思うよ。",
    "ゆうだいが『今日はお菓子食べ放題の日』って宣言してた。",
    "ゆうだいさ、話を聞きながらうんうん頷いてるよ。",
    "ゆうだいが『明日の準備完璧！』って自信満々に言ってる。",
    "ゆうだいさ、最近ずっと同じアニメの曲聴いてるよね。",
    "ゆうだいが『本気出せば楽勝』ってイキがってます笑",
    "ゆうだいさ、あなたのこと影からずっと応援してるみたいだよ。",
    "ゆうだいが『ちょっとコンビニ行ってくる』って出ていきました。",
    "ゆうだいさ、今日の夕飯ラーメンにしようか悩んでるらしい。",
    "ゆうだいが『ん？なんて言った？』って首をかしげてます。",
    "ゆうだいさ、なんだかんだ言って毎回強運を発揮するよね。"
    // ↓ ここに「ゆうだいが…」「ゆうだいさ…」のメッセージを自由に追加できます！
  ];

  function sendMessage() {
    const inputField = document.getElementById("userInput");
    const userText = inputField.value.trim();

    if (userText === "") return;

    // ユーザーメッセージを表示
    addMessage(userText, "user-message");
    inputField.value = "";

    // 0.6秒後にランダムでメッセージを返信
    setTimeout(() => {
      const randomIndex = Math.floor(Math.random() * yudaiMessages.length);
      const randomResponse = yudaiMessages[randomIndex];
      addMessage(randomResponse, "bot-message");
    }, 600);
  }

  function addMessage(text, className) {
    const chatMessages = document.getElementById("chatMessages");
    const messageElement = document.createElement("div");
    messageElement.classList.add("message", className);
    messageElement.textContent = text;
    chatMessages.appendChild(messageElement);
    chatMessages.scrollTop = chatMessages.scrollHeight; // 自動で一番下にスクロール
  }
</script>

</body>
</html>
